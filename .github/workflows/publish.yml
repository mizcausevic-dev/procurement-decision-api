name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: Verify tagged release (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check tag, branch, and package version
        run: |
          git fetch origin main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD
          python -c 'import os, sys, tomllib; from pathlib import Path; version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; sys.exit(0 if os.environ["GITHUB_REF_NAME"] == "v" + version else "tag does not match package version")'
      - name: Install and check source
        run: |
          python -m pip install uv==0.12.18
          uv lock --check
          uv sync --frozen --extra dev --no-editable --no-python-downloads --reinstall-package procurement-decision-api --python "$(command -v python)"
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
          .venv/bin/mypy src
          .venv/bin/pytest -q

  publish:
    name: Build + publish wheel + sdist
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/procurement-decision-api
    permissions:
      id-token: write  # required for Trusted Publisher (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # tag info for hatchling
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install uv==0.12.18 twine==7.0.0
          uv lock --check
      - name: Build distributions
        run: uv build
      - name: Inspect distributions
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true  # PEP 740 Sigstore attestation
